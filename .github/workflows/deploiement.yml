# Déploiement sur le serveur.
#
# Ne se déclenche QUE si la CI est verte : c'est la leçon de Railway, où un
# push sur une CI rouge passait le déploiement en « ignoré » sans rien dire.
# Ici, une CI rouge n'atteint jamais ce fichier, et un déploiement qui échoue
# fait échouer le workflow — donc se voit.
#
# Deux temps séparés à dessein : l'image se construit et se publie même si
# aucun serveur n'est encore branché. Tant que les secrets SSH sont absents,
# la mise à jour du serveur est simplement annoncée comme sautée.
name: Déploiement

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  image:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Déployer exactement le commit que la CI a validé, pas la tête de
          # branche : deux poussées rapprochées ne doivent pas se mélanger.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Se connecter au registre d'images de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  serveur:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Mettre le serveur à jour
        env:
          CLE: ${{ secrets.SSH_CLE }}
          HOTE: ${{ secrets.SSH_HOTE }}
          UTILISATEUR: ${{ secrets.SSH_UTILISATEUR }}
          VERSION: ${{ github.event.workflow_run.head_sha }}
          DEPOT: ${{ github.repository }}
          # Le dépôt est privé, donc l'image l'est aussi. Le serveur
          # s'authentifie avec le jeton de CE déploiement — il expire à la fin
          # du workflow, il n'y a donc aucun secret durable sur la machine.
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$HOTE" ]; then
            echo "::notice::Aucun serveur configuré (secret SSH_HOTE absent) — image publiée, mise à jour sautée."
            echo "SAUTE=oui" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOTE" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 "$UTILISATEUR@$HOTE" \
            "set -e \
             && echo '$JETON' | docker login ghcr.io -u ${{ github.actor }} --password-stdin \
             && cd /srv/maida \
             && export IMAGE=ghcr.io/$DEPOT:$VERSION \
             && docker compose pull app \
             && docker compose up -d app \
             && docker image prune -f \
             && docker logout ghcr.io"

      - name: Vérifier que le site répond
        if: env.SAUTE != 'oui'
        env:
          DOMAINE: ${{ secrets.DOMAINE }}
        run: |
          # Le conteneur applique ses migrations avant d'ouvrir le port : on
          # laisse le temps qu'il faut, mais on ne déclare pas « déployé »
          # sans avoir vu le site répondre.
          for i in $(seq 1 30); do
            if curl -fsS "https://$DOMAINE/health" > /dev/null; then
              echo "Le site répond."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Le site ne répond pas cinq minutes après le déploiement."
          exit 1
